<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dedicated Worker | Penpal Examples</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="example-header">
      <a href="../index.html">Penpal examples</a
      ><span class="status" data-status data-state="connecting"
        >Connecting</span
      >
    </header>
    <main class="example-layout">
      <section>
        <h1>Window and dedicated worker</h1>
        <table class="results">
          <thead>
            <tr>
              <th scope="col">Remote method call</th>
              <th scope="col">Result</th>
            </tr>
          </thead>
          <tbody>
            <tr class="result-row">
              <td>
                <code>workerMethods.<wbr />multiply(2, 6)</code>
              </td>
              <td><output data-result="multiply">-</output></td>
            </tr>
            <tr class="result-row">
              <td>
                <code>workerMethods.<wbr />divide(12, 4)</code>
              </td>
              <td><output data-result="divide">-</output></td>
            </tr>
            <tr class="result-row">
              <td>
                <code>windowMethods.<wbr />add(2, 6)</code>
              </td>
              <td><output data-result="add">-</output></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
    <script type="module" src="./parent.js"></script>
  </body>
</html>
