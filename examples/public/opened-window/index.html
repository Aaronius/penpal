<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opened Window | Penpal Examples</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="example-header">
      <a href="../index.html">Penpal examples</a>
      <span class="status" data-status data-state="ready">Ready</span>
    </header>
    <main class="example-layout">
      <section>
        <h1>Two windows</h1>
        <table class="results">
          <thead>
            <tr>
              <th scope="col">Remote method call</th>
              <th scope="col">Result</th>
            </tr>
          </thead>
          <tbody>
            <tr class="result-row">
              <td>
                <code>openedWindowMethods.<wbr />multiply(2, 6)</code>
              </td>
              <td><output data-result="multiply">-</output></td>
            </tr>
            <tr class="result-row">
              <td>
                <code>openedWindowMethods.<wbr />divide(12, 4)</code>
              </td>
              <td><output data-result="divide">-</output></td>
            </tr>
            <tr class="result-row">
              <td>
                <code>parentMethods.<wbr />add(2, 6)</code>
              </td>
              <td><output data-result="add">-</output></td>
            </tr>
          </tbody>
        </table>
        <div class="example-action">
          <button type="button" data-open-window>Open window</button>
        </div>
      </section>
    </main>
    <script type="module" src="./parent.js"></script>
  </body>
</html>
